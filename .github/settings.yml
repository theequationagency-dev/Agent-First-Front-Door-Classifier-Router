# Repository metadata — the "About" panel.
#
# Applied by the Settings GitHub App (https://github.com/apps/settings), which
# syncs this file to the repository's settings on every push to main that
# touches it. Only the keys listed here are changed; everything else is left
# exactly as it is.
#
# Why a file: the description and topics are repository settings, not
# repository contents, so they cannot be set by committing anything else.
# Keeping them here means they are versioned, reviewable, and survive a
# transfer or fork the same way the rest of the repo does.
#
# `topics` must stay ONE comma-separated string — the app splits on commas.
# Do not add a `name:` key here; that would rename the repository.
#
# The app only syncs on a push to main that adds or modifies this file. If
# it is ever installed after the file already exists, any edit here — even
# to a comment — triggers the first sync.

repository:
  description: "Answer AI agents in one request instead of making them crawl your site. A Cloudflare Worker front door that serves agents live, typed structured data — with an MCP server over the same tables — while humans get your website unchanged. Fork it, point it at your data, ship it. MIT."
  topics: cloudflare-workers, mcp, model-context-protocol, ai-agents, llms-txt, structured-data, agentic-web, d1, edge, ai-crawlers
