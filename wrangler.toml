# Router Worker — classifier, agent payload, /api/* and /admin/*.
# The MCP server is a separate Worker: see mcp/wrangler.toml.
#
# Every value below is a placeholder. Nothing here points at a real site, and
# the Worker refuses to proxy anywhere until you set ORIGIN_URL yourself.

name = "agent-front-door"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# REQUIRED. Where human traffic is proxied — your existing website.
# This MUST be a hostname the Worker route below does not match, or the
# passthrough loops back into this Worker. (The Worker returns 508 rather
# than looping if you get this wrong, and 502 if you leave it unset.)
ORIGIN_URL = "https://example.com"

# What the agent payload says about you. Vars, not literals, so you can
# change the payload without a code deploy.
SITE_NAME = "Example Company"
SITE_DESCRIPTION = "What this organisation does, in one sentence."
CONTACT_EMAIL = "hello@example.com"
MCP_SERVER_URL = "https://mcp.example.com"

# Shared source of truth with the /api routes and the MCP server.
# Create with: wrangler d1 create agent-front-door
[[d1_databases]]
binding = "DB"
database_name = "agent-front-door"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

# Route the Worker in front of your zone. Fill in your domain, then
# uncomment. Until then `wrangler dev` serves it on localhost.
# [[routes]]
# pattern = "example.com/*"
# zone_name = "example.com"

# ADMIN_TOKEN gates /admin/classification-report. It is a secret, not a var:
#   wrangler secret put ADMIN_TOKEN
# For local dev put it in .dev.vars (gitignored).

[env.staging]
vars = { ORIGIN_URL = "https://staging.example.com", SITE_NAME = "Example Company", SITE_DESCRIPTION = "What this organisation does, in one sentence.", CONTACT_EMAIL = "hello@example.com", MCP_SERVER_URL = "https://mcp-staging.example.com" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "agent-front-door-staging"
database_id = "REPLACE_WITH_STAGING_ID"
migrations_dir = "migrations"
